# eval v3 cases. One flow mapping per line (JSON syntax, which is valid YAML), so the runner
# needs no YAML library. Lines starting with # and blank lines are ignored.
# Fields: id, type, persona, question, level (default expert).
#   sql         Athena query (workgroup cascade, db cascade); first row = expected values.
#   tolerance   absolute tolerance for numbers (default 0.05); tol_rel = relative tolerance instead.
#   also_percent  a ratio such as 0.71 may be written as 71%.
#   accept_text  fact with no sql: the text must contain one of these (case-insensitive).
#   accept_alt   not_linked: alternative to "not linked".
#   evidence_prefix  a citation whose evidence_id starts with it, with a url, must exist.
#   repeat_of   copy every field from that case, then override the others.
- {"id": "f1", "type": "fact", "persona": "robert", "question": "What moves my portfolio most?", "sql": "SELECT r2 FROM risk_share WHERE subject = 'robert' AND subject_type = 'persona' AND factor = 'rates'", "tolerance": 0.02, "also_percent": true}
