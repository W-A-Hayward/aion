- {"id": "f10", "type": "fact", "persona": "robert", "question": "What happens to me if oil jumps 15%?", "sql": "SELECT impact_pct * 1000 AS total_per_100k FROM scenarios WHERE subject_type = 'persona' AND subject = 'robert' AND shock_pct = 15", "tol_rel": 0.15}
- {"id": "f11", "type": "fact", "persona": "robert", "question": "What happens to me if rates rise 1 point?", "sql": "SELECT SUM(h.weight * 100 * (exp(l.beta) - 1) * 1000) AS total_per_100k FROM persona_holdings h JOIN links l ON l.link_id = CASE h.ticker WHEN 'TLT' THEN 'us10y>TLT' WHEN 'XBB.TO' THEN 'ca10y>XBB.TO' WHEN 'XLB.TO' THEN 'ca10y>XLB.TO' WHEN 'XRB.TO' THEN 'ca10y>XRB.TO' WHEN 'ZST.TO' THEN 'ca2y>ZST.TO' END WHERE h.persona = 'robert' AND l.lo IS NOT NULL AND l.hi IS NOT NULL", "tol_rel": 0.15}
